# --- Paths ---
data_folder: "wikipedia_20220301.id.processed"
log_dir: "logs/plbert_v2"
config_name: "PL-BERT-V2-ID"

# --- Training ---
num_steps: 1000000
batch_size: 4
gradient_accumulation_steps: 1
log_interval: 100
save_interval: 5000
device: "auto"         # auto / cuda / cpu
resume: true

# --- Optimization ---
optimizer:
  name: "AdamW"
  learning_rate: 5e-5
  weight_decay: 0.01
  max_grad_norm: 1.0

scheduler:
  name: "cosine_with_warmup"   # options: cosine_with_warmup / linear_with_warmup / none
  warmup_steps: 20000
  num_cycles: 0.5              # only used for cosine_with_warmup

mixed_precision: true
gradient_clip: true

# --- Loss weights ---
loss_weights:
  ctc_init: 0.3
  token_init: 0.7
  ctc_after: 0.5
  token_after: 0.5
  warmup_steps: 5000

# --- Model parameters ---
model_params:
  hidden_size: 768
  vocab_size: 32000
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1

# --- Dataset parameters ---
dataset_params:
  tokenizer: "GoToCompany/llama3-8b-cpt-sahabatai-v1-instruct"
  token_separator: " "
  token_mask: "M"
  max_mel_length: 512
  word_mask_prob: 0.15
  phoneme_mask_prob: 0.1
  replace_prob: 0.2

# --- WandB logging ---
wandb:
  enabled: true
  project: "PL-BERT-V2-ID"
  api_key: "17d379f3ed0a7f3308a45e4fa92f5fba41c72dda"

# --- Plot ---
plot:
  refresh_interval: 20
  save_path: "training_plot.png"
